[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parrot-studio-backend"
version = "0.1.0"
description = "Python worker service for Parrot Studio offline video subtitles"
requires-python = ">=3.12,<3.15"
dependencies = [
  "websockets>=13.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
vad = ["onnxruntime>=1.18"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
